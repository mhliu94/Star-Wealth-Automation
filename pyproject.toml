[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starwealth-api"
version = "0.1.0"
description = "Standalone Star Wealth API client, derived from Android 5.1.2"
requires-python = ">=3.11"
dependencies = ["cryptography>=43", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
starwealth = "starwealth.cli:main"

[tool.setuptools.packages.find]
include = ["starwealth*"]

